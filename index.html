<!DOCTYPE html>
<html lang="zh-CN" data-theme="rose">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0910">
<title>我们的时光 · 照片墙</title>
<meta name="description" content="一条向左、一条向右的照片与视频墙，用来收藏我们的每一个瞬间。">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230d0a11'/%3E%3Cpath d='M16 25.5s-8.2-5.3-8.2-10.4A4.9 4.9 0 0 1 16 11.2a4.9 4.9 0 0 1 8.2 3.9c0 5.1-8.2 10.4-8.2 10.4z' fill='%23ff9db1'/%3E%3C/svg%3E">
<meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="我们的时光">
  <meta property="og:description" content="每一帧，都是和你在一起的日子">
  <meta property="og:image" content="https://zly-1123.github.io/our-story/share.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:url" content="https://zly-1123.github.io/our-story/">
</head>
<body>

  <!-- 背景：光斑 + 颗粒 -->
  <div class="bg" aria-hidden="true">
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>
    <div class="bg-grain"></div>
    <div class="bg-vignette"></div>
  </div>

  <header class="site-header">
    <p class="eyebrow" id="eyebrow">OUR LITTLE UNIVERSE</p>
    <h1 class="site-title" id="siteTitle">我们的时光</h1>
    <p class="site-subtitle" id="siteSubtitle">每一帧，都是和你在一起的日子</p>
    <div class="site-meta">
      <span class="meta-item" id="daysTogether" hidden></span>
      <span class="meta-item" id="mediaCount"></span>
    </div>
  </header>

  <main class="wall" id="wall" aria-label="照片与视频墙"></main>

  <footer class="site-footer">
    <p class="hint" id="hint">悬停放大 · 点击查看大图</p>
    <p class="signature" id="signature"></p>
  </footer>

  <!-- ===== 大图查看 ===== -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="大图查看" hidden>
    <div class="lb-backdrop" id="lbBackdrop"></div>

    <div class="lb-topbar">
      <span class="lb-counter" id="lbCounter"></span>
      <button class="lb-btn" id="lbClose" type="button" aria-label="关闭（Esc）">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>

    <div class="lb-stage" id="lbStage"></div>

    <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="上一个（←）">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="下一个（→）">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
    </button>

    <div class="lb-bottom">
      <div class="lb-caption" id="lbCaption"></div>
      <p class="lb-tip" id="lbTip"></p>
    </div>
  </div>

  <button class="bgm-btn" id="bgmBtn" type="button" aria-label="背景音乐" hidden>
    <svg class="bgm-note" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9 18V5l10-2v13" />
      <circle cx="6" cy="18" r="3" />
      <circle cx="16" cy="16" r="3" />
    </svg>
  </button>

  <audio id="bgmAudio" loop preload="none" hidden></audio>

  <script src="js/config.js"></script>
  <script src="js/media.js"></script>
  <script src="js/wall.js"></script>
</body>
</html>
